[project]
name = "stormsight-backend"
version = "0.1.0"
description = "PS 072 - AIML Thunderstorm & Lightning Nowcasting API"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
